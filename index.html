const PTS        = [25,18,15,12,10,8,6,4,2,1];
const SPRINT_PTS = [8,7,6,5,4,3,2,1];
const CPDS       = ["Softs","Mediums","Hards","Intermediates"];
const FAIL       = ["engine failure","hydraulics failure","gearbox failure","suspension damage","power unit issue","brake failure","water pressure loss"];
const EVT_C      = {incident:"#FF4444",dnf:"#FF6644",safetycar:"#FFC906",weather:"#4488FF",charge:"#44CC88",fastestlap:"#CC44FF",battle:"#FF8844",pitstop:"#44AAFF",drop:"#FF8844",start:"#E8002D",strategy:"#BB66FF"};

const pick  = a => a[Math.floor(Math.random()*a.length)];
const pickN = (a,n) => [...a].sort(()=>Math.random()-0.5).slice(0,n);
const Lf    = (t,f) => Math.max(1,Math.floor(t*f));

// ===================== SIMULATION ENGINE =====================

function calcBase(d, team, track) {
  let s = team.carPace*0.55 + d.pace*0.45;
  if (track.type==="high-speed"||track.type==="low-downforce") s+=d.pace*0.06;
  else if (track.type==="technical") s+=d.consistency*0.06;
  else if (track.type==="street") s+=d.experience*0.03+d.defense*0.02;
  if ((d.goodTracks||[]).includes(track.id)) s+=5;
  if ((d.badTracks||[]).includes(track.id)) s-=5;
  s+=((d.mental||7)-5)*0.45;
  return s;
}

function runQ1Q2Q3(drivers, teams, track) {
  const score = (d,team,noise) => calcBase(d,team,track)+(Math.random()-0.5)*noise;

  const q1 = drivers.map(d=>{
    const team=teams.find(t=>t.id===d.teamId)||teams[teams.length-1];
    return {driver:d,team,score:score(d,team,8)};
  }).sort((a,b)=>b.score-a.score).map((e,i)=>({...e,q1Pos:i+1,elim1:i>=15}));

  const q2 = q1.filter(e=>!e.elim1).map(e=>({
    ...e, score:score(e.driver,e.team,6)
  })).sort((a,b)=>b.score-a.score).map((e,i)=>({...e,q2Pos:i+1,elim2:i>=10}));

  const q3 = q2.filter(e=>!e.elim2).map(e=>({
    ...e, score:score(e.driver,e.team,4)
  })).sort((a,b)=>b.score-a.score).map((e,i)=>({...e,q3Pos:i+1}));

  const grid=[...q3,...q2.filter(e=>e.elim2),...q1.filter(e=>e.elim1)];
  return {q1,q2,q3,grid};
}

function runSprint(grid, teams, track) {
  const spLaps=Math.max(12,Math.floor(track.laps*0.27));
  const entries=grid.map((q,i)=>{
    const {driver:d,team}=q;
    let pace=calcBase(d,team,track)-i*0.12*(track.od/100)+(Math.random()-0.5)*7;
    const dnf=Math.random()<0.04;
    return {driver:d,team,gridPos:i+1,pace,dnf,dnfLap:dnf?Math.floor(Math.random()*spLaps)+1:null};
  });
  const fin=entries.filter(e=>!e.dnf).sort((a,b)=>b.pace-a.pace);
  const dns=entries.filter(e=>e.dnf);
  const final=[...fin,...dns];
  let cg=0;
  final.forEach((e,i)=>{
    e.finalPos=i+1;
    if(i===0){e.gap=0;return;}
    if(e.dnf){e.gap=null;return;}
    cg=parseFloat((cg+Math.random()*1.6+0.2).toFixed(3));
    e.gap=cg;
  });
  final.forEach((e,i)=>{e.points=!e.dnf&&i<8?SPRINT_PTS[i]:0;});
  return {positions:final,sprintLaps:spLaps};
}

function runRace(grid, teams, track) {
  const TL=track.laps, events=[];
  const isWet=Math.random()*100<track.wr;
  const hasSC=Math.random()<0.52;
  const scLap=hasSC?Lf(TL,0.2)+Math.floor(Math.random()*Lf(TL,0.3)):0;
  const scEnd=hasSC?scLap+Math.floor(Math.random()*4)+3:0;

  let entries=grid.map((q,i)=>{
    const {driver:d,team}=q;
    let pace=isWet?team.carPace*0.35+d.pace*0.15+d.wet*0.5:team.carPace*0.5+d.pace*0.3+d.consistency*0.2;
    if(track.type==="street") pace+=(d.experience+d.defense)*0.05;
    if(track.type==="high-speed") pace+=d.pace*0.06;
    if(track.type==="technical") pace+=d.consistency*0.06;
    if(track.type==="low-downforce") pace+=d.pace*0.08;
    if((d.goodTracks||[]).includes(track.id)) pace+=3;
    if((d.badTracks||[]).includes(track.id)) pace-=3;
    pace+=((d.mental||7)-5)*0.35;
    pace-=i*0.18*(track.od/100)*(hasSC?0.55:1);
    pace+=(Math.random()-0.5)*9;
    const dnfR=(100-team.reliability)/100*0.28+Math.max(0,(5-(d.mental||7))*0.02);
    const dnf=Math.random()<dnfR;
    const dnfL=dnf?Math.max(2,Lf(TL,0.05)+Math.floor(Math.random()*Lf(TL,0.85))):null;
    const fl1=i>4&&Math.random()<0.032;
    return {driver:d,team,gridPos:i+1,pace,dnf:dnf||fl1,dnfLap:fl1?1:dnfL,fl1,compound:pick(CPDS)};
  });

  const finishers=entries.filter(e=>!e.dnf).sort((a,b)=>b.pace-a.pace);
  const dnfs=entries.filter(e=>e.dnf).sort((a,b)=>(b.dnfLap||0)-(a.dnfLap||0));
  const final=[...finishers,...dnfs];

  const pole=grid[0];
  const badS=pick(grid.slice(2,8));
  events.push({lap:1,type:"start",icon:"🚦",text:`LIGHTS OUT! ${pole.driver.name} nails the launch from pole. ${badS.driver.name} loses ground immediately.`});
  const fl1a=pick(grid.slice(3,11)),fl1b=pick(grid.slice(3,11).filter(e=>e!==fl1a));
  if(fl1b) events.push({lap:1,type:"incident",icon:"⚠️",text:`LAP 1: ${fl1a.driver.name} and ${fl1b.driver.name} touch through the first complex — both continue.`});
  entries.filter(e=>e.fl1).forEach(e=>events.push({lap:1,type:"incident",icon:"💥",text:`FIRST LAP CHAOS! ${e.driver.name} is OUT!`}));
  if(isWet){
    events.push({lap:1,type:"weather",icon:"🌧️",text:`RAIN at ${track.circuit}! Wet tyres mandatory.`});
    events.push({lap:Lf(TL,0.28),type:"weather",icon:"🌤️",text:`Lap ${Lf(TL,0.28)}: Track drying — switch to inters now viable.`});
  }
  [[0,4,Lf(TL,0.09),"the lead"],[4,8,Lf(TL,0.14),"the points"],[8,13,Lf(TL,0.19),"upper midfield"],[13,18,Lf(TL,0.23),"lower midfield"],[18,22,Lf(TL,0.27),"the back"]].forEach(([a,b,lap,lbl])=>{
    const grp=final.slice(a,b).filter(e=>!e.dnf);
    if(grp.length<2) return;
    const [x,y]=pickN(grp,2);
    if(x&&y) events.push({lap,type:"battle",icon:"🔥",text:`Lap ${lap}: ${x.driver.name} and ${y.driver.name} nose-to-tail in ${lbl}.`});
  });
  const p1b=Lf(TL,0.30);
  pickN(finishers.slice(0,Math.min(10,finishers.length)),5).forEach((e,i)=>{
    const lap=p1b+i*2;
    events.push({lap,type:"pitstop",icon:"🔄",text:`LAP ${lap}: ${e.driver.name} (${e.team.name}) pits for ${pick(CPDS)}. ${Math.random()<0.5?"Undercut attempt.":"Extending strategy."}`});
  });
  if(finishers.length>=4){
    const[u1,u2]=finishers.slice(1,5);
    if(u1&&u2) events.push({lap:p1b+3,type:"strategy",icon:"♟️",text:`LAP ${p1b+3}: ${u1.driver.name} attempts the undercut on ${u2.driver.name}.`});
  }
  [[0,1],[2,3],[5,6],[8,9],[11,12],[14,15],[17,18]].forEach(([a,b],idx)=>{
    if(!finishers[a]||!finishers[b]) return;
    const lap=Lf(TL,0.42)+idx*Math.floor(TL*0.025);
    events.push({lap,type:"battle",icon:"🔥",text:`Lap ${lap}: ${finishers[a].driver.name} vs ${finishers[b].driver.name} — DRS! Side by side!`});
  });
  if(hasSC){
    events.push({lap:scLap,type:"safetycar",icon:"🚗",text:`SAFETY CAR lap ${scLap}! Field bunches. Strategy chaos across the pitlane.`});
    const scF=finishers.length>3?pick(finishers.slice(3,Math.min(10,finishers.length))):null;
    if(scF) events.push({lap:scLap+1,type:"pitstop",icon:"🔄",text:`LAP ${scLap+1}: ${scF.driver.name} dives in under the safety car — free stop!`});
    events.push({lap:scEnd,type:"safetycar",icon:"🟢",text:`Green flag lap ${scEnd}! Safety car in — gaps erased, racing resumes.`});
  }
  entries.filter(e=>e.dnf&&!e.fl1&&e.dnfLap>1).forEach(e=>events.push({lap:e.dnfLap,type:"dnf",icon:"🔧",text:`LAP ${e.dnfLap}: RETIREMENT — ${e.driver.name} (${e.team.name}) — ${pick(FAIL)}.`}));
  const p2b=Lf(TL,0.57);
  pickN(finishers.slice(0,Math.min(10,finishers.length)),4).forEach((e,i)=>{
    const lap=p2b+i*2;
    events.push({lap,type:"pitstop",icon:"🔄",text:`LAP ${lap}: ${e.driver.name} pits — ${pick(CPDS)} fitted. ${Math.random()<0.5?"Second stop.":"Final stop."}`});
  });
  final.forEach((e,fi)=>{
    const ch=(e.gridPos-1)-fi;
    if(!e.dnf&&Math.abs(ch)>=5) events.push({lap:Lf(TL,0.5)+Math.floor(Math.random()*Lf(TL,0.2)),type:ch>0?"charge":"drop",icon:ch>0?"⚡":"📉",text:ch>0?`${e.driver.name} flying — ${ch} places gained from grid!`:`${e.driver.name} drops ${Math.abs(ch)} — tyres gone.`});
  });
  if(finishers.length>=3){
    const gS=(((final[1]?.gap||5)*0.35)).toFixed(1);
    events.push({lap:TL-Math.floor(Math.random()*5)-4,type:"battle",icon:"🏁",text:`Late in the race: ${finishers[1].driver.name} closing on ${finishers[0].driver.name} — gap ${gS}s!`});
  }
  if(finishers[9]&&finishers[10]) events.push({lap:TL-3,type:"battle",icon:"🔥",text:`LAP ${TL-3}: ${finishers[9].driver.name} vs ${finishers[10].driver.name} — final points position!`});
  const flD=finishers.length>0?pick(finishers.slice(0,Math.min(8,finishers.length))):null;
  if(flD){
    const flL=Lf(TL,0.78)+Math.floor(Math.random()*Lf(TL,0.12));
    events.push({lap:flL,type:"fastestlap",icon:"💜",text:`FASTEST LAP: ${flD.driver.name} goes purple on lap ${flL}!`});
  }
  if(finishers.length>=20){
    const[bk1,bk2]=finishers.slice(-4);
    if(bk1&&bk2) events.push({lap:Lf(TL,0.65),type:"battle",icon:"🔥",text:`Lap ${Lf(TL,0.65)}: ${bk1.driver.name} and ${bk2.driver.name} — their own battle at the back.`});
  }

  let cumGap=0;
  final.forEach((e,i)=>{
    e.finalPos=i+1;
    if(i===0){e.gap=0;return;}
    if(e.dnf){e.gap=null;return;}
    const diff=(final[0].pace-e.pace)*0.55;
    cumGap=Math.max(cumGap+Math.random()*2.2,diff>0?diff:cumGap+0.5);
    e.gap=parseFloat(cumGap.toFixed(3));
  });
  final.forEach((e,i)=>{
    e.points=(!e.dnf&&i<10)?PTS[i]:0;
    if(flD&&e.driver.id===flD.driver.id&&!e.dnf&&i<10) e.points+=1;
  });

  events.sort((a,b)=>a.lap-b.lap);
  return {positions:final,events,fastestLap:flD?.driver||null,isWet,hasSC,scLap,totalLaps:TL};
}

function downloadStage(lines, stageDef, track) {
  const W=1200, PAD=44, AV=36;
  const colX=PAD+AV+14, textMaxW=W-colX-PAD-20;
  const tmp=document.createElement("canvas").getContext("2d");
  tmp.font="15px Arial,sans-serif";
  const wrapped=lines.map(l=>{
    const words=l.text.split(" "), tls=[];
    let cur="";
    words.forEach(w=>{
      const t=cur?cur+" "+w:w;
      if(tmp.measureText(t).width>textMaxW&&cur){tls.push(cur);cur=w;}
      else cur=t;
    });
    if(cur) tls.push(cur);
    return {...l,tls};
  });
  let H=130;
  wrapped.forEach(l=>{H+=20+l.tls.length*22+24+14;});
  H+=30;
  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;
  const c=canvas.getContext("2d");
  c.fillStyle="#0C0C0F"; c.fillRect(0,0,W,H);
  c.fillStyle=stageDef.color; c.fillRect(0,0,W,5);
  c.fillStyle="#111115"; c.fillRect(0,5,W,95);
  c.font="bold 26px Arial,sans-serif"; c.fillStyle=stageDef.color;
  c.fillText(stageDef.title,PAD,46);
  c.font="14px Arial,sans-serif"; c.fillStyle="#666";
  c.fillText(track.name+" | "+track.circuit,PAD,72);
  c.font="bold 16px Arial,sans-serif"; c.fillStyle="#E8002D";
  c.fillText("F1 SIM",W-PAD-80,46);
  c.font="12px Arial,sans-serif"; c.fillStyle="#444";
  c.fillText("2027 SEASON",W-PAD-80,68);
  c.strokeStyle="#222"; c.lineWidth=1;
  c.beginPath(); c.moveTo(0,100); c.lineTo(W,100); c.stroke();
  let y=118;
  wrapped.forEach(line=>{
    const ic=line.speaker==="CROFT";
    const col=ic?"#E8002D":"#4466AA";
    const bg=ic?"#1A0808":"#080818";
    const tc=ic?"#E8D8D8":"#D0D8E8";
    const lh=line.tls.length*22+20;
    c.beginPath(); c.arc(PAD+AV/2,y+12,AV/2,0,Math.PI*2);
    c.fillStyle=bg; c.fill();
    c.strokeStyle=col; c.lineWidth=2; c.stroke();
    c.font="bold 10px Arial,sans-serif";
    c.fillStyle=ic?"#fff":col; c.textAlign="center";
    c.fillText(ic?"DC":"MB",PAD+AV/2,y+16); c.textAlign="left";
    c.font="bold 10px Arial,sans-serif"; c.fillStyle=col;
    c.fillText(ic?"DAVID CROFT":"MARTIN BRUNDLE",colX,y+12);
    c.fillStyle=bg; c.fillRect(colX,y+18,W-colX-PAD,lh);
    c.fillStyle=col; c.fillRect(colX,y+18,3,lh);
    c.font="15px Arial,sans-serif"; c.fillStyle=tc;
    line.tls.forEach((tl,ti)=>c.fillText(tl,colX+12,y+34+ti*22));
    y+=lh+14+20;
  });
  c.font="11px Arial,sans-serif"; c.fillStyle="#333";
  c.fillText("Generated by F1 SIM",PAD,H-12);
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`${track.circuit.replace(/\s+/g,"-").toLowerCase()}-${stageDef.key}.png`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  });
}

function HighlightedText({text,surnameMap}){
  if(!text)return null;
  const sn=Object.keys(surnameMap).sort((a,b)=>b.length-a.length);
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp(`\\b(${sn.map(esc).join("|")})\\b`,"g");
  const parts=[]; let last=0,m;
  re.lastIndex=0;
  while((m=re.exec(text))!==null){
    if(m.index>last) parts.push({t:text.slice(last,m.index),c:null});
    parts.push({t:m[1],c:surnameMap[m[1]]});
    last=re.lastIndex;
  }
  if(last<text.length) parts.push({t:text.slice(last),c:null});
  return <span>{parts.map((p,i)=>p.c?<span key={i} style={{color:p.c,fontWeight:700,textShadow:`0 0 14px ${p.c}44`}}>{p.t}</span>:<span key={i}>{p.t}</span>)}</span>;
}

      podium:race.positions.slice(0,3).map(e=>e.driver.name),
      raceResults:race.positions.reduce((a,e)=>({...a,[e.driver.id]:e.points}),{}),
      sprintResults:sprint?sprint.positions.reduce((a,e)=>({...a,[e.driver.id]:e.points}),{}):null,
    };
    setChampionship(prev=>[...prev,entry]);
    setRaceSaved(true);
  };

  const getStandings=()=>{
    return drivers.map(d=>{
      let pts=0,wins=0;
      championship.forEach(r=>{
        pts+=(r.raceResults?.[d.id]||0)+(r.sprintResults?.[d.id]||0);
        if(r.winner===d.name) wins++;
      });
      return {driver:d,pts,wins};
    }).sort((a,b)=>b.pts-a.pts||b.wins-a.wins).filter(s=>championship.length===0||s.pts>0);
  };

  const doCommentary=async()=>{
    if(!race||!apiKey) return;
    setIsGen(true); setStages(null); setActiveS(0); setView("commentary");
    setGenMsg("Wiring up the commentary booth…");
    const grid=qual.grid.map((e,i)=>`P${i+1}: ${e.driver.name} (${e.team.name})`).join("\n");
    const results=race.positions.map((e,i)=>e.dnf?`P${i+1}: ${e.driver.name} (${e.team.name}) — DNF lap ${e.dnfLap} [grid P${e.gridPos}]`:`P${i+1}: ${e.driver.name} (${e.team.name}) — ${i===0?"WINNER":`+${e.gap}s`} [grid P${e.gridPos}] ${e.points>0?`+${e.points}pts`:""}`).join("\n");
    const evtLog=race.events.map(e=>`[Lap ${e.lap||"pre"}] ${e.text}`).join("\n");
    const L=race.totalLaps;
    const surnames=drivers.map(d=>d.name.split(" ").pop()).join(", ");
    const prompt=`You are writing a live Formula 1 TV broadcast. Two legendary commentators call the race lap-by-lap in real time.

DAVID CROFT (key: "CROFT"): Electric play-by-play. Uses "LIGHTS OUT AND AWAY WE GO!", "GO! GO! GO!", "THAT IS SENSATIONAL!", shouts capitals for drama. Always states exact lap numbers ("ON LAP 23 NOW—"). Excitable, emotional, sometimes gets ahead of himself.

MARTIN BRUNDLE (key: "BRUNDLE"): Former F1 driver. Technical, dry British wit. "I can tell you from experience...", "The data will be telling them...", "That's a very bold call." Calm when Croft excites, gently corrects him, predicts things. References driving career occasionally.

HARD RULES:
1. Every single line MUST reference a specific lap number
2. Lines REACT to each other — Croft interrupts, Brundle corrects, they agree/disagree
3. Reference actual gaps, compounds, team names from the data
4. All 22 surnames MUST appear at least once: ${surnames}
5. Each stage: 8–10 lines, STRICTLY alternating CROFT/BRUNDLE, never two of the same in a row
6. The midfield stage covers P8–P22 ONLY: Hülkenberg, Bortoleto, Gasly, Colapinto, Ocon, Bearman, Stroll, Pérez, Bottas, Lawson, Lindblad must ALL appear there

RACE DATA:
GRAND PRIX: ${track.name} — ${track.circuit}
LAPS: ${L} | ${race.isWet?"WET CONDITIONS":"Dry"} | ${race.hasSC?`Safety car lap ${race.scLap}`:"No safety car"} | FL: ${race.fastestLap?.name||"N/A"}
GRID: ${grid}
RESULT: ${results}
EVENTS: ${evtLog}

Return ONLY valid JSON — no markdown, nothing else:
{"stages":[
  {"key":"start","lines":[{"speaker":"CROFT","text":"..."},{"speaker":"BRUNDLE","text":"..."}]},
  {"key":"early","lines":[...]},
  {"key":"pits","lines":[...]},
  {"key":"mid","lines":[...]},
  {"key":"midfield","lines":[...]},
  {"key":"closing","lines":[...]},
  {"key":"podium","lines":[...]}
]}`;
    setGenMsg("Croft and Brundle are at the microphone…");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3500,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      const raw=data.content?.map(c=>c.text||"").join("")||"";
      setGenMsg("Feeding broadcast to the studio…");
      try{
        const clean=raw.replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(clean);
        if(parsed.stages&&Array.isArray(parsed.stages)){
          setStages(parsed.stages.map(s=>s.lines&&Array.isArray(s.lines)?s:{...s,lines:[{speaker:"CROFT",text:s.text||""}]}));
        } else setStages([{key:"start",lines:[{speaker:"CROFT",text:raw}]}]);
      }catch{
        const paras=raw.split("\n\n").filter(Boolean);
        setStages(STAGE_DEFS.map((s,i)=>({key:s.key,lines:[{speaker:"CROFT",text:paras[i]||paras[0]||"Commentary unavailable."}]})));
      }
    }catch{setStages([{key:"start",lines:[{speaker:"CROFT",text:"Unable to generate commentary — please check connection and try again."}]}]);}
    finally{setIsGen(false);setGenMsg("");}
  };

                {race.isWet&&<span style={{background:"#4488FF18",color:"#4488FF",fontSize:10,fontWeight:700,padding:"2px 7px",letterSpacing:1,borderRadius:2}}>🌧️ WET</span>}
                {race.hasSC&&<span style={{background:"#FFC90618",color:"#FFC906",fontSize:10,fontWeight:700,padding:"2px 7px",letterSpacing:1,borderRadius:2}}>🚗 SC LAP {race.scLap}</span>}
                {race.fastestLap&&<span style={{background:"#CC44FF18",color:"#CC44FF",fontSize:10,fontWeight:700,padding:"2px 7px",letterSpacing:1,borderRadius:2}}>💜 FL: {race.fastestLap.name}</span>}
                {raceSaved&&<span style={{background:"#44CC8818",color:"#44CC88",fontSize:10,fontWeight:700,padding:"2px 7px",letterSpacing:1,borderRadius:2}}>✓ SAVED TO CHAMPIONSHIP</span>}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
              <div>
                <div style={{fontSize:10,color:"#444",letterSpacing:2,marginBottom:7}}>CLASSIFICATION</div>
                {race.positions.map((e,i)=>(
                  <div key={e.driver.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",marginBottom:3,background:e.dnf?"#1A1010":i<3?"#181810":"#161618",border:`1px solid ${e.dnf?"#FF444418":i<3?"#FFC90618":"#1E1E22"}`,borderLeft:`3px solid ${e.dnf?"#FF4444":e.team.color}`,borderRadius:2,opacity:e.dnf?0.65:1}}>
                    <div style={{width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",background:i===0?"#FFC906":i===1?"#888":i===2?"#CD7F32":"transparent",color:i<3?"#000":"#666",fontSize:10,fontWeight:700,borderRadius:2,border:i>=3?"1px solid #2A2A30":"none",flexShrink:0}}>{e.dnf?"DNF":i+1}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.driver.name}</div>
                      <div style={{fontSize:9,color:e.team.color,letterSpacing:1}}>{e.team.name}</div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      {e.dnf?<div style={{fontSize:10,color:"#FF4444"}}>L{e.dnfLap}</div>
                            :<><div style={{fontSize:11,fontFamily:"monospace",color:i===0?"#FFC906":"#bbb"}}>{i===0?"🏁 WIN":`+${e.gap}s`}</div>{e.points>0&&<div style={{fontSize:9,color:"#E8002D",fontWeight:700}}>+{e.points}pts</div>}</>}
                    </div>
                  </div>
                ))}
              </div>
              <div>
                <div style={{fontSize:10,color:"#444",letterSpacing:2,marginBottom:7}}>RACE EVENTS ({race.events.length})</div>
                <div style={{maxHeight:540,overflowY:"auto"}}>
                  {race.events.map((ev,i)=>(
                    <div key={i} style={{borderLeft:`3px solid ${EVT_C[ev.type]||"#555"}`,padding:"7px 11px",marginBottom:4,background:"#161618",borderRadius:"0 3px 3px 0"}}>
                      {ev.lap>0&&<div style={{fontSize:8,color:"#444",letterSpacing:1,marginBottom:2}}>LAP {ev.lap}</div>}
                      <div style={{fontSize:11,lineHeight:1.5}}>{ev.icon} {ev.text}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div style={{marginTop:16,display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
              <button onClick={doRace} style={{background:"#2A2A30",color:"#ccc",border:"none",padding:"10px 18px",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:2,borderRadius:3}}>↺ RE-RUN</button>
              <button onClick={saveToChampionship} disabled={raceSaved} style={{background:raceSaved?"#1A2A1A":"#44CC88",color:raceSaved?"#44CC88":"#000",border:`1px solid ${raceSaved?"#44CC8844":"transparent"}`,padding:"10px 18px",cursor:raceSaved?"default":"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3,opacity:raceSaved?0.7:1}}>
                {raceSaved?"✓ SAVED":"💾 SAVE TO CHAMPIONSHIP"}
              </button>
              <button onClick={()=>setView("commentary")} style={{background:"#CC44FF",color:"#fff",border:"none",padding:"10px 24px",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,letterSpacing:2,borderRadius:3}}>🎙️ CROFT & BRUNDLE →</button>
            </div>
          </div>
        )}

        {/* ══ COMMENTARY ══ */}
        {view==="commentary"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            {!apiKey&&(
              <div style={{background:"#18140A",border:"1px solid #FFC90644",borderLeft:"4px solid #FFC906",borderRadius:"0 6px 6px 0",padding:"14px 18px",marginBottom:16}}>
                <div style={{fontSize:12,color:"#FFC906",fontWeight:700,marginBottom:6,letterSpacing:1}}>🔑 API KEY REQUIRED FOR AI COMMENTARY</div>
                <div style={{fontSize:11,color:"#777",marginBottom:10}}>Enter your Anthropic API key to enable Croft & Brundle. Get one free at <span style={{color:"#4488FF"}}>console.anthropic.com</span></div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <input type="password" placeholder="sk-ant-api03-..." value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()}
                    style={{flex:1,minWidth:220,background:"#0C0C0F",border:"1px solid #555",color:"#F0F0F0",padding:"8px 12px",fontFamily:"inherit",fontSize:12,borderRadius:3}}/>
                  <button onClick={saveApiKey} style={{background:"#FFC906",color:"#000",border:"none",padding:"8px 18px",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1,borderRadius:3}}>SAVE KEY</button>
                </div>
                <div style={{fontSize:9,color:"#444",marginTop:6}}>Stored in your browser only. Only sent to Anthropic's API. Never shared.</div>
              </div>
            )}
            {apiKey&&(
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:4}}>
                <button onClick={clearApiKey} style={{background:"none",border:"none",color:"#333",cursor:"pointer",fontFamily:"inherit",fontSize:9,letterSpacing:1}}>× CLEAR API KEY</button>
              </div>
            )}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:22,fontWeight:700,letterSpacing:3}}>CROFT & BRUNDLE</div>
              <div style={{display:"flex",gap:14,marginTop:8,alignItems:"center",flexWrap:"wrap"}}>
                {[{l:"DC",n:"DAVID CROFT",sub:"Play-by-play",c:"#E8002D",bg:"#E8002D22"},{l:"MB",n:"MARTIN BRUNDLE",sub:"Colour commentary",c:"#4466AA",bg:"#08081A"}].map(x=>(
                  <div key={x.l} style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:32,height:32,borderRadius:"50%",background:x.bg,border:`2px solid ${x.c}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:x.c}}>{x.l}</div>
                    <div><div style={{fontSize:11,fontWeight:700,color:x.c,letterSpacing:1}}>{x.n}</div><div style={{fontSize:9,color:"#555"}}>{x.sub}</div></div>
                  </div>
                ))}
                <div style={{marginLeft:"auto",fontSize:10,color:"#444"}}>{track.flag} {track.name.toUpperCase()}</div>
              </div>
            </div>

            {isGen&&(
              <div style={{background:"#111115",border:"1px solid #1E1E22",borderRadius:8,padding:50,textAlign:"center"}}>
                <div style={{display:"flex",justifyContent:"center",gap:20,marginBottom:22}}>
                  {[{l:"DC",c:"#E8002D",d:1.2},{l:"MB",c:"#4466AA",d:1.5}].map(x=>(
                    <div key={x.l} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                      <div style={{width:44,height:44,borderRadius:"50%",background:x.l==="DC"?"#E8002D22":"#08081A",border:`2px solid ${x.c}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:x.c,animation:`pulse ${x.d}s ease-in-out infinite`}}>{x.l}</div>
                      <div style={{fontSize:9,color:x.c,letterSpacing:1}}>{x.l==="DC"?"CROFT":"BRUNDLE"}</div>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:14,fontWeight:700,color:"#CC44FF",letterSpacing:2,animation:"pulse 1.3s ease-in-out infinite",marginBottom:8}}>{genMsg||"GENERATING BROADCAST…"}</div>
                <div style={{fontSize:11,color:"#444",letterSpacing:1}}>LAP-BY-LAP DIALOGUE · ALL 22 DRIVERS · 7 STAGES</div>
              </div>
            )}

            {stages&&!isGen&&(()=>{
              const s=STAGE_DEFS[activeS];
              const sd=stages.find(x=>x.key===s.key);
              const lines=sd?.lines||[];
              return(
                <>
                  <div style={{display:"flex",gap:3,marginBottom:16,flexWrap:"wrap",background:"#111115",border:"1px solid #1E1E22",borderRadius:5,padding:5}}>
                    {STAGE_DEFS.map((st,i)=>{
                      const sd2=stages.find(x=>x.key===st.key);
                      if(!sd2) return null;
                      return(
                        <button key={st.key} onClick={()=>setActiveS(i)} style={{flex:"0 0 auto",background:activeS===i?`${st.color}20`:"transparent",color:activeS===i?st.color:"#555",border:`1px solid ${activeS===i?st.color+"55":"transparent"}`,padding:"6px 10px",cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:700,letterSpacing:1,borderRadius:3,transition:"all 0.15s",whiteSpace:"nowrap"}}>
                          {st.emoji} {st.title} <span style={{opacity:0.5,fontSize:9}}>{sd2.lines?.length||0}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div key={activeS} style={{animation:"slideIn 0.22s ease"}}>
                    <div style={{background:`${s.color}0D`,border:`1px solid ${s.color}33`,borderLeft:`5px solid ${s.color}`,borderRadius:"0 8px 8px 0",padding:"13px 18px",marginBottom:16,display:"flex",alignItems:"center",gap:12,justifyContent:"space-between"}}>
                      <div style={{display:"flex",alignItems:"center",gap:12}}>
                        <span style={{fontSize:26}}>{s.emoji}</span>
                        <div>
                          <div style={{fontSize:18,fontWeight:700,color:s.color,letterSpacing:2}}>{s.title}</div>
                          <div style={{fontSize:10,color:"#555",marginTop:2}}>{s.lapHint} · {lines.length} EXCHANGES</div>
                        </div>
                      </div>
                      <button onClick={()=>downloadStage(lines,s,track)} title="Download as image"
                        style={{background:`${s.color}20`,color:s.color,border:`1px solid ${s.color}44`,padding:"7px 14px",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1,borderRadius:3,flexShrink:0}}>
                        ⬇ DOWNLOAD PNG
                      </button>
                    </div>
                    <div style={{background:"#0D0D10",border:"1px solid #1A1A20",borderRadius:8,padding:"18px 18px 4px"}}>
                      {lines.map((line,li)=><DialogueLine key={li} speaker={line.speaker} text={line.text} surnameMap={surnameMap}/>)}
                    </div>
                  </div>

                  <div style={{marginTop:14,display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
                    {STAGE_DEFS.map((st,i)=>{
                      if(!stages.find(x=>x.key===st.key)) return null;
                      return<div key={i} onClick={()=>setActiveS(i)} style={{background:activeS===i?`${st.color}15`:"#161618",border:`1px solid ${activeS===i?st.color+"44":"#222"}`,borderTop:`2px solid ${st.color}`,borderRadius:3,padding:"7px 3px",cursor:"pointer",textAlign:"center",transition:"all 0.15s"}}>
                        <div style={{fontSize:14}}>{st.emoji}</div>
                        <div style={{fontSize:7,color:activeS===i?st.color:"#444",fontWeight:700,letterSpacing:0.3,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{st.title}</div>
                      </div>;
                    })}
                  </div>

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
                    <button onClick={()=>setActiveS(a=>Math.max(0,a-1))} disabled={activeS===0} style={{background:"#2A2A30",color:activeS===0?"#2A2A30":"#ccc",border:"none",padding:"9px 18px",cursor:activeS===0?"default":"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3,opacity:activeS===0?0.3:1}}>← PREV</button>
                    <div style={{display:"flex",gap:5}}>{STAGE_DEFS.map((_,i)=><div key={i} onClick={()=>setActiveS(i)} style={{width:i===activeS?22:7,height:7,borderRadius:4,background:i===activeS?STAGE_DEFS[activeS].color:"#2A2A30",cursor:"pointer",transition:"all 0.2s"}}/>)}</div>
                    <button onClick={()=>setActiveS(a=>Math.min(STAGE_DEFS.length-1,a+1))} disabled={activeS===STAGE_DEFS.length-1} style={{background:STAGE_DEFS[Math.min(activeS+1,STAGE_DEFS.length-1)].color,color:"#fff",border:"none",padding:"9px 18px",cursor:activeS===STAGE_DEFS.length-1?"default":"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3,opacity:activeS===STAGE_DEFS.length-1?0.3:1}}>NEXT →</button>
                  </div>

                  <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:12}}>
                    <button onClick={doCommentary} style={{background:"#2A2A30",color:"#ccc",border:"none",padding:"9px 18px",cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3}}>↺ REGENERATE</button>
                    <button onClick={()=>{setView("tracks");setQual(null);setSprint(null);setRace(null);setStages(null);}} style={{background:"#E8002D",color:"#fff",border:"none",padding:"9px 22px",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,letterSpacing:2,borderRadius:3}}>NEW RACE →</button>
                  </div>
                </>
              );
            })()}

            {!stages&&!isGen&&(
              <div style={{background:"#111115",border:"1px solid #1E1E22",borderRadius:8,padding:50,textAlign:"center"}}>
                <div style={{fontSize:11,color:"#333",letterSpacing:1}}>Run a race first, then send Croft and Brundle to the booth.</div>
              </div>
            )}
          </div>
        )}

        {/* ══ CHAMPIONSHIP ══ */}
        {view==="championship"&&(
          <div style={{animation:"fadeIn 0.2s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:10}}>
              <div>
                <div style={{fontSize:22,fontWeight:700,letterSpacing:3}}>🏆 CHAMPIONSHIP</div>
                <div style={{fontSize:11,color:"#444",letterSpacing:1,marginTop:2}}>{championship.length} ROUNDS COMPLETED · 2027 SEASON</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>{if(championship.length>0)setChampionship(prev=>prev.slice(0,-1));}} disabled={championship.length===0}
                  style={{background:championship.length===0?"#1A1A1A":"#2A2A30",color:championship.length===0?"#333":"#FFC906",border:`1px solid ${championship.length===0?"#1A1A1A":"#FFC90644"}`,padding:"8px 16px",cursor:championship.length===0?"default":"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3}}>
                  ↩ UNDO LAST
                </button>
                <button onClick={()=>{if(window.confirm("Reset the entire championship? This cannot be undone."))setChampionship([]);}} disabled={championship.length===0}
                  style={{background:championship.length===0?"#1A1A1A":"#2A1010",color:championship.length===0?"#333":"#FF4444",border:`1px solid ${championship.length===0?"#1A1A1A":"#FF444444"}`,padding:"8px 16px",cursor:championship.length===0?"default":"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700,letterSpacing:1.5,borderRadius:3}}>
                  ✕ RESET
                </button>
              </div>
            </div>

            {championship.length===0?(
              <div style={{background:"#111115",border:"1px solid #1E1E22",borderRadius:8,padding:50,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:12}}>🏆</div>
                <div style={{fontSize:13,color:"#444",letterSpacing:1}}>No races saved yet. Complete a race and click "Save to Championship".</div>
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                {/* Standings */}
                <div>
                  <div style={{fontSize:10,color:"#444",letterSpacing:2,marginBottom:8}}>DRIVER STANDINGS</div>
                  {getStandings().map((s,i)=>{
                    const team=teams.find(t=>t.id===s.driver.teamId);
                    return(
                      <div key={s.driver.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",marginBottom:4,background:i<3?"#181810":"#161618",border:`1px solid ${i<3?"#FFC90622":"#1E1E22"}`,borderLeft:`3px solid ${team?.color||"#555"}`,borderRadius:3}}>
                        <div style={{width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",background:i===0?"#FFC906":i===1?"#888":i===2?"#CD7F32":"transparent",color:i<3?"#000":"#666",fontSize:10,fontWeight:700,borderRadius:2,border:i>=3?"1px solid #2A2A30":"none",flexShrink:0}}>{i+1}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:700}}>{s.driver.flag} {s.driver.name}</div>
                          <div style={{fontSize:9,color:team?.color||"#888",letterSpacing:1}}>{team?.name||""} {s.wins>0?`· ${s.wins} WIN${s.wins>1?"S":""}`:""}</div>
                        </div>
                        <div style={{fontSize:20,fontWeight:900,color:i===0?"#FFC906":i<3?"#aaa":"#666",fontFamily:"monospace"}}>{s.pts}</div>
                        <div style={{fontSize:9,color:"#444"}}>PTS</div>
                      </div>
                    );
                  })}
                </div>

                {/* Race history */}
                <div>
                  <div style={{fontSize:10,color:"#444",letterSpacing:2,marginBottom:8}}>RACE HISTORY</div>
                  <div style={{maxHeight:500,overflowY:"auto"}}>
                    {[...championship].reverse().map((r,i)=>(
                      <div key={r.id} style={{background:"#161618",border:"1px solid #1E1E22",borderRadius:4,padding:"12px 14px",marginBottom:6}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                          <span style={{fontSize:10,color:"#555",letterSpacing:1}}>ROUND {r.round}</span>
                          <div style={{display:"flex",gap:5}}>
                            {r.hasSprint&&<span style={{fontSize:8,color:"#FFC906",background:"#FFC90620",padding:"1px 5px",borderRadius:2,fontWeight:700}}>⚡ SPRINT</span>}
                          </div>
                        </div>
                        <div style={{fontSize:14,fontWeight:700}}>{r.trackFlag} {r.trackName}</div>
                        <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                          {r.podium?.map((n,pi)=>(
                            <span key={pi} style={{fontSize:10,background:pi===0?"#FFC90620":pi===1?"#88888820":"#CD7F3220",color:pi===0?"#FFC906":pi===1?"#888":"#CD7F32",padding:"2px 7px",borderRadius:2,fontWeight:700}}>
                              {pi===0?"🥇":pi===1?"🥈":"🥉"} {n}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {modal&&<EditModal type={modal.type} data={modal.data} teams={teams} onSave={modal.type==="driver"?saveDriver:saveTeam} onClose={()=>setModal(null)}/>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<F1Sim />);
  </script>
</body>
</html>
