<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2126">
<meta name="robots" content="noindex, nofollow">
<title>F1 SIM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================== F1 SIM design system =====================
   Pit-wall look: concrete greys by day, asphalt by night. Team colours
   carry identity; tyre colours appear only on tyres. */
:root {
  --bg: #E6E9EC; --side: #DCE1E5; --panel: #F7F8F9; --panel-2: #EEF1F3; --ink: #142130; --muted: #56636F; --line: #CDD3D8; --line-strong: #9AA6B0;
  --accent: #0B5FA5; --on-ink: #F7F8F9; --ok: #2F7A4F; --ok-soft: #DCEFE3; --bad: #B3261E; --bad-soft: #F6DEDC; --flag: #F2A900; --flag-ink: #3A2A00;
  --you: #DDE8F3; --me-row: #E4EDF6;
  --f1-soft: #E10600; --f1-medium: #F5C400; --f1-hard: #FFFFFF; --f1-hard-edge: #8A949C; --f1-inter: #2FA84F; --f1-wet: #1D6FD1; --f1-flag: #F2A900;
  --bar-track: #E1E6EA; --bar-base: #142130;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 8px; --side-w: 232px; --top-h: 56px;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1C2126; --side: #171B1F; --panel: #252B31; --panel-2: #2D343B; --ink: #E6EAEE; --muted: #9AA5AF; --line: #3A434B; --line-strong: #56626C;
  --accent: #7FB2F0; --on-ink: #1C2126; --ok: #7CC79A; --ok-soft: #1F3A2B; --bad: #F2867E; --bad-soft: #3D2321; --you: #26384A; --me-row: #233343;
  --f1-hard: #F2F2F2; --f1-hard-edge: #C9CED3; --bar-track: #343C44; --bar-base: #E6EAEE; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1C2126; --side: #171B1F; --panel: #252B31; --panel-2: #2D343B; --ink: #E6EAEE; --muted: #9AA5AF; --line: #3A434B; --line-strong: #56626C;
  --accent: #7FB2F0; --on-ink: #1C2126; --ok: #7CC79A; --ok-soft: #1F3A2B; --bad: #F2867E; --bad-soft: #3D2321; --you: #26384A; --me-row: #233343;
  --f1-hard: #F2F2F2; --f1-hard-edge: #C9CED3; --bar-track: #343C44; --bar-base: #E6EAEE; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--cond); line-height: 1.1; margin: 0 0 8px; }
h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 700; } h3 { font-size: 19px; font-weight: 700; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); } .small { font-size: 13.5px; } .bad-text { color: var(--bad); } .nowrap { white-space: nowrap; } .num { text-align: right; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-rows: var(--top-h) 1fr; min-height: 100vh; background: linear-gradient(to right, var(--side) var(--side-w), transparent var(--side-w)); }
.topbar { grid-column: 1 / -1; position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--side); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--side); z-index: 40; }
.brand { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; font: 700 24px/1 var(--cond); letter-spacing: 0.02em; cursor: pointer; color: var(--ink); }
.brand-mark { width: 22px; height: 22px; border-radius: 3px; background: conic-gradient(var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0) 0 0 / 11px 11px; box-shadow: inset 0 0 0 1.5px var(--ink); }
.brand-mark.big { width: 48px; height: 48px; background-size: 16px 16px; border-radius: 6px; display: inline-block; margin-bottom: 14px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.who { font: 600 16px var(--cond); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who select { font: 600 15px var(--body); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 46vw; }
.rc-badge { font: 600 13px var(--cond); background: var(--ink); color: var(--on-ink); border-radius: 4px; padding: 4px 8px; white-space: nowrap; }
.menu-btn { display: none; border: 0; background: none; padding: 6px; margin-left: -6px; cursor: pointer; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.nav-group + .nav-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.nav-h { font: 600 13px var(--cond); color: var(--muted); margin: 0 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 500; color: var(--ink); position: relative; }
.nav-item:hover { background: var(--panel-2); }
.nav-item[aria-current="page"] { background: var(--panel); font-weight: 600; }
.nav-item[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--ink); }
.count { margin-left: auto; font: 600 12.5px/1 var(--cond); background: var(--f1-soft); color: #fff; border-radius: 10px; padding: 3px 7px; }
.main { min-width: 0; outline: none; }
.page { max-width: 1320px; margin: 0 auto; padding: 24px clamp(14px, 3vw, 32px) 64px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; background: none; }
  .menu-btn { display: inline-flex; }
  .side { position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); left: 0; bottom: 0; height: auto; width: min(86vw, 300px); z-index: 25; transform: translateX(-105%); transition: transform .18s ease; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .nav-open .side { transform: none; }
  .hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- page furniture ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head > div:first-child { max-width: 72ch; }
.page-head p { color: var(--muted); margin: 6px 0 0; }
.eyebrow { font: 600 15px var(--cond); color: var(--muted); margin: 0 0 4px !important; }
.lead { margin: 0 0 14px; }
.section-h { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; } .section-h .count { margin-left: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
.card[style*="--team"] { border-top: 4px solid var(--team); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; } .cards > .card { margin-bottom: 0; }
.cards + * { margin-top: 16px; }
.empty-card { text-align: left; max-width: 640px; }
.empty { padding: 40px 0; color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 720px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metric { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; }
.metric b { font: 700 32px/1 var(--cond); } .metric span { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
details summary { cursor: pointer; font-weight: 600; } details[open] summary { margin-bottom: 8px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 14px; min-height: 38px; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 14px; }
.btn[aria-pressed="true"], .btn.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.file-btn { position: relative; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--muted); margin-bottom: 12px; }
.field input, .field select, .field textarea, .ctl select, .btn-row input, .who select { color: var(--ink); }
input[type=text], input[type=number], input[type=password], select, textarea { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; min-height: 38px; width: 100%; font-size: 15px; }
input[type=color] { width: 64px; height: 38px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
textarea { resize: vertical; line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.tag { display: inline-block; font: 600 13px/1 var(--cond); padding: 4px 7px; border-radius: 4px; background: var(--panel-2); color: var(--muted); vertical-align: 2px; white-space: nowrap; }
.tag.player { background: var(--ok-soft); color: var(--ok); } .tag.you { background: var(--you); color: var(--accent); }
.tag.open { background: var(--flag); color: var(--flag-ink); } .tag.flag { background: var(--flag); color: var(--flag-ink); }
.tag.wet { background: var(--f1-wet); color: #fff; } .tag.damp { background: var(--f1-inter); color: #fff; }
.tag.life { background: var(--you); color: var(--accent); } .tag.on { background: var(--ink); color: var(--on-ink); }
table.data { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.data th { text-align: left; font: 600 13.5px var(--cond); color: var(--muted); padding: 0 8px 6px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data th.num, table.data td.num { text-align: right; }
table.data.compact td { padding: 5px 8px; }
table.data tr.me td { background: var(--me-row); }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 18, .45); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); z-index: 51; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.2); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer > header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.drawer > header p { color: var(--muted); margin: 4px 0 0; }
.drawer .body { padding: 16px 20px 28px; overflow-y: auto; }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); background: var(--panel); border-radius: 10px; padding: 20px; z-index: 52; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 8px; z-index: 60; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- boot and sign-in ---------- */
.boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.boot-card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
.boot-card h1 { font-size: 34px; }
.auth-form { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.auth-form .btn { margin-top: 6px; justify-content: center; }
.au-rules { list-style: none; padding: 0; margin: -4px 0 10px; font-size: 13.5px; color: var(--muted); }
.au-rules li.ok { color: var(--ok); } .au-rules li.bad { color: var(--bad); } .au-mark { display: inline-block; width: 18px; }
.notice { background: var(--panel-2); border-left: 4px solid var(--accent); padding: 8px 12px; border-radius: 4px; } .notice.warn { border-left-color: var(--bad); }
.auth-links { margin-top: 14px; } .link-row { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; font-weight: 600; }
.kicker { font: 600 15px var(--cond); color: var(--muted); margin: 0 0 6px; }

/* ---------- characters, home, paddock ---------- */
.char-card.active { box-shadow: inset 0 0 0 2px var(--ink); }
.char-card .meta { color: var(--muted); margin-top: -4px; } .char-card .bio { color: var(--muted); font-size: 14px; }
.your-seat h2 { margin-bottom: 4px; }
.home { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; align-items: start; }
.home .hero-race { grid-column: 1 / -1; } .home .hero-race h2 { font-size: clamp(30px, 4vw, 44px); }
.home-posts { grid-column: 1 / -1; } .home-posts > h2 { margin: 8px 0 12px; }
@media (max-width: 820px) { .home { grid-template-columns: 1fr; } }
.podium { list-style: none; margin: 0 0 6px; padding: 0; counter-reset: p; }
.podium li { counter-increment: p; display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; padding: 8px 0; border-bottom: 1px solid var(--line); }
.podium li::before { content: counter(p); grid-row: 1 / 3; font: 700 32px/1 var(--cond); color: var(--muted); border-left: 4px solid var(--team); padding-left: 8px; align-self: center; }
.podium li span { color: var(--muted); font-size: 13.5px; }
.paddock { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 960px) { .paddock { grid-template-columns: 1fr; } .paddock .facts { order: -1; } }
.filters { margin: 0 0 14px; }
.facts { position: sticky; top: calc(var(--top-h) + 16px); } .facts ul { padding-left: 18px; margin: 0 0 8px; }
.post h2 { font-size: 26px; margin: 6px 0 10px; } .post-meta { color: var(--muted); font-size: 13.5px; margin: 0; }
.post-body p { max-width: 70ch; } .post.life h2 { font-family: var(--body); font-size: 21px; font-weight: 600; }

/* ---------- the grid ---------- */
.f1-teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.f1-teams > .card { margin-bottom: 0; }
@media (max-width: 520px) { .f1-teams { grid-template-columns: 1fr; } }
.f1-team > header { display: flex; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; margin-bottom: 4px; }
.f1-team > header h2 { margin: 0; } .f1-team > header .meta { color: var(--muted); font-size: 13.5px; flex: 1 1 200px; } .f1-team > header .btn { margin-left: auto; }
.f1-seatlist { list-style: none; margin: 0; padding: 0; }
.f1-seatlist li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.f1-seatlist .role { font: 600 14px/1.3 var(--cond); color: var(--muted); padding-top: 2px; }
.f1-seatlist .ctl { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.f1-seatlist .ctl select { flex: 1 1 190px; min-width: 0; width: auto; min-height: 34px; padding: 5px 8px; font-size: 14px; }
.f1-occ b { font-weight: 600; } .f1-occ .small { display: block; }
.f1-ratings { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

/* ---------- race weekend ---------- */
.f1-bar { display: inline-block; width: 4px; height: 18px; border-radius: 1px; vertical-align: middle; margin-right: 7px; }
.f1-tyre { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 3px solid; font: 700 11px/1 var(--cond); background: var(--panel); vertical-align: middle; color: var(--ink); }
.f1-tyre.soft { border-color: var(--f1-soft); } .f1-tyre.medium { border-color: var(--f1-medium); } .f1-tyre.hard { border-color: var(--f1-hard-edge); }
.f1-tyre.inter { border-color: var(--f1-inter); } .f1-tyre.wet { border-color: var(--f1-wet); }
.f1-age { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
.f1-lap { font: 700 clamp(56px, 8vw, 96px)/0.82 var(--cond); text-align: right; letter-spacing: -0.03em; }
.f1-lap small { display: block; font-size: 16px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-bottom: 6px; }
.f1-lap .of { color: var(--muted); }
@media (max-width: 600px) { .f1-lap { text-align: left; } }
.f1-main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.f1-main > .card { margin-bottom: 0; }
@media (max-width: 1100px) { .f1-main { grid-template-columns: 1fr; } }
.f1-feed { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow: auto; }
.f1-feed li { display: grid; grid-template-columns: 38px 1fr; gap: 8px; padding: 5px 6px; border-left: 3px solid transparent; font-size: 14.5px; }
.f1-feed li .l { font: 600 13.5px var(--cond); color: var(--muted); text-align: right; }
.f1-feed li.sc, .f1-feed li.vsc { border-left-color: var(--f1-flag); background: color-mix(in srgb, var(--f1-flag) 14%, transparent); }
.f1-feed li.dnf { border-left-color: var(--bad); } .f1-feed li.pit .t { color: var(--muted); }
.f1-feed li.order, .f1-feed li.weather, .f1-feed li.call { border-left-color: var(--accent); } .f1-feed li.finish { font-weight: 600; border-left-color: var(--ink); }
.f1-car { border-top: 3px solid var(--team); padding: 10px 0 12px; } .f1-car + .f1-car { border-top-width: 1px; border-top-color: var(--line); }
.f1-car h3 { margin: 0 0 4px; }
.f1-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.f1-row .lbl { font-size: 13px; color: var(--muted); width: 58px; }
.f1-gauge { font-size: 13px; color: var(--muted); } .f1-gauge .track { height: 7px; background: var(--bar-track); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.f1-gauge .fill { height: 100%; background: var(--bar-base); } .f1-gauge .fill.hot { background: var(--bad); }
.f1-gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.f1-chart svg { display: block; width: 100%; min-width: 640px; height: auto; }
.f1-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.f1-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.f1-up { color: var(--ok); font-size: 12px; font-weight: 600; } .f1-down { color: var(--bad); font-size: 12px; font-weight: 600; }
.sub { font: 500 14px var(--body); color: var(--muted); margin-left: 6px; }

/* ---------- roles: practice, upgrades, careers ---------- */
.dials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 12px; margin-top: 8px; }
@media (max-width: 560px) { .dials { grid-template-columns: 1fr; } }
.runs { margin: 12px 0 0; padding-left: 18px; } .runs > li { margin-bottom: 8px; } .runs ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
.f1-car .btn-row select { width: auto; min-height: 38px; }
.proj h3 { margin-bottom: 4px; } .proj p { margin-bottom: 6px; }
.linkish { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: var(--ink); }
.page-head .field select { min-width: 200px; }

/* ---------- live race weekend ---------- */
:root { --fl: #8E3AC9; --pb: #2F7A4F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fl: #C38BF2; --pb: #7CC79A; } }
:root[data-theme="dark"] { --fl: #C38BF2; --pb: #7CC79A; }
.stages { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: -6px 0 18px; counter-reset: st; }
.stages li { counter-increment: st; font: 600 15px var(--cond); color: var(--muted); padding: 5px 12px 5px 8px; border-radius: 4px; background: var(--panel-2); }
.stages li::before { content: counter(st); display: inline-block; width: 18px; color: var(--line-strong); }
.stages li.done { color: var(--ink); } .stages li.done::before { content: "✓"; color: var(--ok); }
.stages li.now { background: var(--ink); color: var(--on-ink); } .stages li.now::before { color: var(--on-ink); opacity: .7; }
.f1-lap.live small { color: var(--f1-soft); }
.f1-lap.live small::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--f1-soft); margin-right: 6px; vertical-align: 1px; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.tag.live { background: var(--f1-soft); color: #fff; }
.card.rc.is-live { box-shadow: inset 4px 0 0 var(--f1-soft); }
.rc .btn-row select { width: auto; }
.chips { margin: 8px 0 0 !important; display: flex; gap: 6px; flex-wrap: wrap; }
table.timing td { padding-top: 5px; padding-bottom: 5px; white-space: nowrap; }
table.timing tr.picked td { background: var(--me-row); }
table.timing tr.out td { color: var(--muted); }
td.fl, span.fl { color: var(--fl); font-weight: 700; } td.pb, span.pb { color: var(--pb); font-weight: 600; }
.drv-btn { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 0; white-space: nowrap; }
.drv-btn b { font: 700 16px var(--cond); } .drv-btn .full { color: var(--muted); font-size: 13.5px; margin-left: 7px; }
.drv-btn:hover .full, .drv-btn[aria-pressed="true"] .full { color: var(--ink); text-decoration: underline; }
@media (max-width: 600px) { .drv-btn .full { display: none; } }
.legend-line { margin: 10px 0 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: -4px 0 12px; }
.tab { border: 0; background: none; padding: 8px 12px; font: 600 16px var(--cond); color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.driver-head { border-left: 4px solid var(--team); padding-left: 10px; margin-bottom: 12px; } .driver-head h3 { margin: 0; } .driver-head p { margin: 2px 0 0; }
.small-metrics .metric b { font-size: 24px; } .small-metrics { margin-bottom: 8px; }
h4 { font: 700 17px var(--cond); margin: 16px 0 6px; }
.f1-feed.short { max-height: 220px; }

/* ---------- view as, applications ---------- */
.view-as { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--flag); color: var(--flag-ink); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.view-as .btn { margin-left: auto; }
.brackets { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.bracket { text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; font: inherit; color: inherit; margin: 0; }
.bracket b { font: 700 19px var(--cond); } .bracket.on { box-shadow: inset 0 0 0 2px var(--ink); } .bracket:disabled { cursor: default; }
table.arrange td { vertical-align: middle; } table.arrange .btn.small { min-height: 30px; padding: 3px 9px; }
.journey { padding-left: 20px; margin: 0 0 14px; } .journey li { margin-bottom: 8px; max-width: 75ch; }
.notice.warn { border-left: 4px solid var(--bad); }

/* ---------- race strategy ---------- */
.plan { margin-top: 6px; }
.plan-grid { display: grid; grid-template-columns: 0.7fr 1.15fr 1.15fr; gap: 0 12px; }
@media (max-width: 760px) { .plan-grid { grid-template-columns: 1fr; } }
table.stops { max-width: 520px; } table.stops select { width: auto; min-height: 34px; padding: 4px 8px; } table.stops input { min-height: 34px; padding: 4px 8px; }
.plan-look { margin: 10px 0 4px; }
.warn-note { color: var(--bad); margin: 2px 0; }
.strategy .f1-car .tabs { margin-top: 8px; }

/* ---------- moments, notifications, profiles, awards, team depth ---------- */
.card.moment { border: 2px solid var(--f1-soft); box-shadow: 0 0 0 4px color-mix(in srgb, var(--f1-soft) 18%, transparent); }
.card.moment h2 { font-size: 28px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; color: var(--ink); font: inherit; }
.choice b { font: 700 20px var(--cond); } .choice span { font-size: 13.5px; color: var(--muted); } .choice .odds { color: var(--ink); font-weight: 600; margin-top: auto; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--ink); }
.bell { position: relative; border: 0; background: none; color: var(--ink); cursor: pointer; padding: 6px; display: inline-flex; }
.bell .count { position: absolute; top: -2px; right: -4px; margin: 0; }
.feed-list { list-style: none; margin: 0; padding: 0; } .feed-list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.feed-list li.new .linkish { font-weight: 600; } .feed-list li.urgent { background: color-mix(in srgb, var(--f1-soft) 10%, transparent); padding-left: 8px; }
.feed-list .muted { white-space: nowrap; } .notice-item + .notice-item { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.profile-head { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
.profile-head > div { flex: 1 1 280px; } .profile-head h1 { margin-bottom: 2px; }
.portrait { border-radius: 10px; object-fit: cover; border-bottom: 5px solid var(--team, var(--line)); background: var(--panel-2); flex: none; }
.portrait.none { display: inline-grid; place-items: center; font: 700 40px var(--cond); color: var(--muted); }
.timeline { list-style: none; padding: 0; margin: 0; } .timeline li { padding: 6px 0 6px 14px; border-left: 2px solid var(--line); }
.timeline li .muted { display: block; }
.rels { list-style: none; padding: 0; margin: 0; } .rels li { padding: 6px 0; border-bottom: 1px solid var(--line); } .rels p { margin: 2px 0 0; }
.tag.rival { background: var(--bad-soft); color: var(--bad); } .tag.friend { background: var(--ok-soft); color: var(--ok); } .tag.mentor, .tag.history { background: var(--you); color: var(--accent); }
.tag.trophy { background: var(--f1-medium); color: #2a2200; }
.diary + .diary { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; } .diary h3 { margin: 2px 0 6px; }
.vote-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.vote { position: relative; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--team); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; }
.vote b { font: 700 17px var(--cond); } .vote span { font-size: 13px; color: var(--muted); } .vote .votes { position: absolute; right: 10px; top: 10px; font: 700 18px var(--cond); color: var(--ink); }
.vote.on { box-shadow: inset 0 0 0 2px var(--ink); }
.awards { list-style: none; padding: 0; margin: 0; } .awards li { padding: 4px 0; }
.card-preview { width: 100%; max-width: 420px; border-radius: 8px; display: block; margin: 8px 0; }
.offer { border-left: 4px solid var(--team); padding-left: 12px; margin-bottom: 12px; }
.f1-feed li.moment { border-left-color: var(--f1-soft); } .f1-feed li.penalty { border-left-color: var(--bad); }

/* ---------- presets, triggers, test track ---------- */
.preset-bar { margin: 6px 0 10px; } .preset-bar select { width: auto; }
.triggers { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.trigger { display: grid; grid-template-columns: 1.6fr 0.7fr 0.7fr 1.3fr 1.1fr auto; gap: 0 10px; align-items: end; background: var(--panel-2); border-radius: 6px; padding: 8px 10px 0; }
.trigger .field { margin-bottom: 8px; } .trigger > .btn { margin-bottom: 8px; }
.trigger select, .trigger input { min-height: 34px; padding: 4px 8px; font-size: 14px; }
@media (max-width: 900px) { .trigger { grid-template-columns: 1fr 1fr; } }
.trig-status { margin: 4px 0 8px; padding-left: 18px; font-size: 14px; } .trig-status li.fired { color: var(--muted); }
.f1-feed li.trigger { border-left-color: var(--f1-medium); }

/* ---------- series and seasons ---------- */
.series-pick select { font: 700 15px var(--cond); background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--series); border-radius: 6px; padding: 5px 8px; width: auto; min-height: 34px; }
.cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 12px; margin: 8px 0; }
.champ { font-size: 16px; } .season-card details { margin-top: 8px; }
@media (max-width: 600px) { .series-pick select { max-width: 90px; } }

/* ---------- practice sessions, set-up guide, debriefs ---------- */
.guide { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin: 8px 0 12px; } .guide summary { cursor: pointer; } .guide p { margin: 8px 0; max-width: 85ch; }
.debriefs { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }

.nav-version { margin: 18px 12px 6px; font-size: 12.5px; color: var(--muted); }

.fp-events { margin: 4px 0 10px; padding-left: 18px; font-size: 14px; }

/* ---------- streamlined race weekend ---------- */
.now-card .now-stage { font: 600 18px var(--cond); margin: 0 0 8px; }
.now-table td { vertical-align: top; } .now-table td:first-child { white-space: nowrap; }
.wk-tabs { margin: 16px 0 12px; }
.car-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pill { border: 1px solid var(--line); border-left: 4px solid var(--team); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: 600 14px var(--sans); cursor: pointer; }
.pill[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.quali-setup { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.trig-box { margin-top: 10px; } .trig-box summary { cursor: pointer; margin-bottom: 6px; }

.guide { margin-bottom: 6px; } .guide-use { margin: 0 0 12px; }

/* ---------- race weekend: pit-wall layout ---------- */
.wk-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.wk-title h1 { margin: 2px 0 0; } .wk-title p { margin: 0; }
.stat-strip { display: flex; flex-wrap: wrap; gap: 28px; }
.stat-strip > div { display: flex; flex-direction: column; }
.stat-strip span { font-size: 13.5px; color: var(--muted); }
.stat-strip b { font: 700 34px/1.05 var(--cond); }
.stat-strip b.hi { color: var(--ink); box-shadow: inset 0 -5px 0 var(--team, var(--line)); }
.wk-cols { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.wk-rail { flex: 1 1 220px; max-width: 300px; display: flex; flex-direction: column; gap: 6px; }
.wk-main { flex: 999 1 520px; min-width: 0; }
.wk-side { flex: 1 1 300px; max-width: 420px; min-width: 0; }
.wk-side .card, .wk-main .card { margin-bottom: 16px; }
@media (max-width: 1100px) { .wk-rail, .wk-side { max-width: none; } }
.wk-rail h2 { font: 700 18px var(--cond); margin: 14px 0 4px; }
.rail-car { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: inset 0 3px 0 var(--team); }
.rail-car b { display: block; font: 700 19px var(--cond); }
.rail-sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rail-sessions li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px; font-size: 14.5px; color: var(--muted); }
.rail-sessions li.now { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--team); }
.rail-views { display: flex; flex-direction: column; gap: 2px; }
.rail-views button { text-align: left; min-height: 40px; padding: 6px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); font: 500 15px var(--sans); cursor: pointer; }
.rail-views button.on { background: var(--ink); color: var(--panel); font-weight: 600; }
.rail-views button:hover:not(.on) { background: var(--panel); }
.rail-defaults { margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.rail-defaults dt { color: var(--muted); font-size: 13px; } .rail-defaults dd { margin: 0; }
.short-times td:first-child { width: 28px; color: var(--muted); }
.rail-feed { max-height: 520px; overflow-y: auto; }
/* ---------- team branding ---------- */
.team-logo { width: 28px; height: 28px; object-fit: contain; vertical-align: middle; margin-right: 8px; border-radius: 4px; background: var(--panel); }
.team-logo.big { width: 64px; height: 64px; margin: 0; } .team-logo.tiny { width: 18px; height: 18px; margin-right: 6px; }
.team-banner { position: relative; border-radius: 12px; overflow: hidden; background: var(--team); min-height: 120px; margin-bottom: 18px; display: flex; align-items: flex-end; }
.team-banner .banner-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.team-banner-id { position: relative; display: flex; align-items: center; gap: 12px; margin: 16px; padding: 8px 14px; background: var(--panel); border-radius: 10px; font: 700 26px var(--cond); }
.team-banner .car-img { position: relative; margin: 0 16px 0 auto; max-height: 120px; max-width: 40%; object-fit: contain; align-self: center; }
.brand-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.brand-preview { height: 130px; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; overflow: hidden; background: var(--panel-2); }
.brand-preview img { width: 100%; height: 100%; object-fit: cover; } .brand-slot.logo .brand-preview img { object-fit: contain; padding: 10px; }
.grid-car { display: block; width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }

/* ---------- characters showcase ---------- */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { min-height: 44px; padding: 0 16px; border: 0; background: none; color: var(--ink); font: 600 15px var(--body); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.ppl-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
.ppl-filters input[type=search] { flex: 1 1 200px; min-height: 44px; } .ppl-filters select { width: auto; min-height: 44px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 15px var(--body); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
.ppl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.ppl-card { display: flex; flex-direction: column; text-align: left; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; color: var(--ink); font: inherit; }
.ppl-card:hover { border-color: var(--line-strong); }
.ppl-photo { position: relative; aspect-ratio: 1 / 1.05; background: var(--panel-2); display: grid; place-items: center; border-bottom: 8px solid var(--team); }
.ppl-photo img { width: 100%; height: 100%; object-fit: cover; }
.ppl-init { font: 700 60px var(--cond); color: var(--line-strong); }
.ppl-num { position: absolute; right: 12px; top: 6px; font: 700 34px var(--cond); color: var(--ink); text-shadow: 0 0 6px var(--panel); }
.ppl-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 1px; }
.ppl-name { font: 700 22px/1.1 var(--cond); }
.ppl-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.ppl-stats > span { display: flex; flex-direction: column; } .ppl-stats b { font: 700 20px var(--cond); } .ppl-stats span span { font-size: 12.5px; color: var(--muted); }
.ppl-toggle { display: inline-flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.ppl-series h2 { font: 700 30px var(--cond); margin: 22px 0 10px; }
.ppl-team { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.ppl-banner { position: relative; height: 84px; background: var(--team); display: flex; align-items: flex-end; }
.ppl-banner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ppl-team-id { position: relative; display: flex; align-items: center; gap: 8px; margin: 0 0 -22px 16px; padding: 6px 14px 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.ppl-team-id h3 { margin: 0; font: 700 24px var(--cond); } .ppl-team-id .team-logo { margin: 0; width: 36px; height: 36px; }
.ppl-seats { padding: 34px 16px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ppl-seats.loose { padding: 0; }
.ppl-seat { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); text-align: left; color: var(--ink); font: inherit; }
.ppl-seat > span { display: flex; flex-direction: column; min-width: 0; } .ppl-seat b { font-weight: 600; }
button.ppl-seat { cursor: pointer; } button.ppl-seat:hover { border-color: var(--line-strong); }
.ppl-seat.other { background: var(--panel-2); border-color: transparent; color: var(--muted); }
.ppl-seat.open { border-style: dashed; border-color: var(--line-strong); }
.ppl-thumb { flex: none; border-radius: 50%; object-fit: cover; } .ppl-thumb.none { display: inline-grid; place-items: center; background: var(--panel-2); font: 700 17px var(--cond); color: var(--muted); }
.reg-wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.reg-filters { flex: 1 1 170px; max-width: 210px; display: flex; flex-direction: column; gap: 10px; }
.reg-filters input[type=search] { min-height: 44px; } .reg-filters fieldset { border: 0; margin: 4px 0 0; padding: 0; } .reg-filters legend { font: 700 18px var(--cond); margin-bottom: 2px; }
.reg-check { display: flex; gap: 8px; align-items: center; min-height: 34px; }
.reg-table { flex: 999 1 460px; min-width: 0; padding: 4px 8px; }
.reg-preview { flex: 1 1 270px; max-width: 340px; padding: 0 0 16px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.reg-preview > :not(.reg-photo) { margin-left: 16px; margin-right: 16px; } .reg-preview h2 { margin-top: 6px; margin-bottom: 0; font: 700 28px/1 var(--cond); } .reg-preview p { margin-top: 0; margin-bottom: 0; }
.reg-photo { height: 190px; background: var(--panel-2); display: grid; place-items: center; border-bottom: 8px solid var(--team); } .reg-photo img { width: 100%; height: 100%; object-fit: cover; }
/* ---------- a character's page ---------- */
.char-hero { margin: 10px 0 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.char-banner { position: relative; height: 170px; background: var(--team); } .char-banner img { width: 100%; height: 100%; object-fit: cover; }
.char-id { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 22px; padding: 0 24px 20px; }
.char-photo { width: 168px; height: 196px; margin-top: -96px; border-radius: 12px; background: var(--panel-2); border: 4px solid var(--panel); display: grid; place-items: center; overflow: hidden; position: relative; }
.char-photo img { width: 100%; height: 100%; object-fit: cover; }
.char-name { flex: 1 1 320px; } .char-name h1 { margin: 2px 0 0; font-size: 56px; line-height: 1; } .char-name p { margin: 4px 0 0; }
.char-actions { padding: 0 24px 18px; }
.char-cols { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.char-left { flex: 1 1 230px; max-width: 300px; } .char-mid { flex: 999 1 420px; min-width: 0; } .char-right { flex: 1 1 280px; max-width: 380px; }
.char-left .card, .char-mid .card, .char-right .card { margin-bottom: 16px; }
@media (max-width: 1100px) { .char-left, .char-right { max-width: none; } }
.rating-bars { display: flex; flex-direction: column; gap: 8px; }
