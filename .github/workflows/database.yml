# Applies new files in supabase/migrations/ to your Supabase project.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    the database password you chose when creating the project
#   SUPABASE_PROJECT_ID     the project reference: the xxxx in https://xxxx.supabase.co
name: Set up database

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/database.yml']
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error title=Secrets missing::Add these repository secrets, then re-run this workflow:$missing"; exit 1; fi
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations
        run: supabase db push
